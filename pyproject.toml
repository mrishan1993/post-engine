[project]
name = "content-pipeline"
version = "0.1.0"
description = "Automated AI content pipeline with mandatory human QA gate + trend engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
trends = [
    "pytrends>=4.9",
]

[project.scripts]
pipeline = "cli.main:app"
trend = "trend_engine.cli.main:app"
predict = "prediction.cli:app"
assets = "asset_engine.cli:app"
story = "story_engine.cli:app"
storyboard = "storyboard_engine.cli:app"
prompt = "prompt_engine.cli:app"
generate = "generation_engine.cli:app"
videogen = "video_generation_engine.cli:app"
imagegen = "image_generation_engine.cli:app"
musicgen = "music_sfx_engine.cli:app"
voicegen = "voice_generation_engine.cli:app"
assemble = "assembly_engine.cli:app"
publish = "publishing_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "cli",
    "config",
    "db",
    "metrics",
    "monitoring",
    "orchestration",
    "providers",
    "qa",
    "rigs",
    "trend_engine",
    "prediction",
    "amp_platform",
    "asset_engine",
    "story_engine",
    "storyboard_engine",
    "prompt_engine",
    "generation_engine",
    "video_generation_engine",
    "image_generation_engine",
    "music_sfx_engine",
    "voice_generation_engine",
    "assembly_engine",
    "publishing_engine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
