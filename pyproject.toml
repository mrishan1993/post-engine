[project]
name = "content-pipeline"
version = "0.1.0"
description = "Automated AI content pipeline with mandatory human QA gate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pipeline = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "cli",
    "config",
    "db",
    "metrics",
    "monitoring",
    "orchestration",
    "providers",
    "qa",
    "rigs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
